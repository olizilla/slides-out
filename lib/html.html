<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title></title>
<style>
	body {
		font-family: system-ui, -apple-system, sans-serif;
		max-width: 800px;
		margin: 0px auto;
		padding: 0 20px;
		line-height: 1.6;
		background: #fafafa;
		color: #222;
	}
	h1 {
		text-align: center;
		margin-bottom: 40px;
	}
	.slide {
		background: white;
		border: 1px solid #eaeaea;
		margin-bottom: 48px;
		box-shadow: 0 4px 6px rgba(0,0,0,0.02);
	}
	.slide-img {
		max-width: 100%;
		height: auto;
		border-bottom: 1px solid #eee;
		display: block;
		margin: 0 auto;
	}
	.slide-notes {
		padding: 24px;
		white-space: pre-wrap;
	}
	hr {
		border: 0;
		border-top: 1px solid #eee;
		margin: 48px 0;
	}
	footer {
		font-size: 0.85em;
		color: #666;
		text-align: center;
		margin-top: 64px;
		border-top: 1px solid #eee;
		padding-top: 24px;
	}
	footer a {
		color: #333;
		text-decoration: none;
	}
	footer a:hover {
		text-decoration: underline;
	}
</style>
</head>
<body>
	<h1 id="title"></h1>
	<template id="slide-template">
		<figure class="slide" id="slide-id">
			<a class="slide-link" href="#slide-id">
				<img class="slide-img" src="" alt="">
			</a>
			<figcaption class="slide-notes"></figcaption>
		</figure>
	</template>
	<footer>
		<p>Original Deck:
			<a id="deck-link" href="" target="_blank"></a>
		</p>
		<p>Published: <span id="pub-date"></span></p>
	</footer>
</body>
</html>
